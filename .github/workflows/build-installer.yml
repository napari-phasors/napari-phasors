name: Build standalone installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Optional. Release tag to build installers for and attach them
          to (e.g. v0.7.0). The tag must already exist as a published
          GitHub release, and its version must already be on conda-forge
          (run this after the napari-phasors feedstock update has merged).
          Leave empty to build from the current branch against the latest
          napari-phasors release on conda-forge; the installers are then
          only uploaded as workflow artifacts and no release is touched.
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Pointed at a closed port so any attempt to reach the network during
  # installation fails immediately. Installing must stay fully offline:
  # constructor embeds every package in the installer and links them with
  # `conda install --offline`. Only plugin installs and upgrades made later
  # from inside the app need a connection.
  OFFLINE_PROXY: "http://127.0.0.1:9"

jobs:
  build-installer:
    name: Build installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-14
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest

      - name: Install constructor
        shell: bash -el {0}
        run: |
          conda install -y constructor pillow pyyaml

      - name: Determine version
        id: version
        shell: bash -el {0}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The installer bundles napari-phasors itself rather than pip
          # installing it, so every buildable version must exist on
          # conda-forge. Resolve against the channel up front so a missing
          # version fails here with a clear message instead of deep inside
          # constructor's solver.
          # conda search returns one record per build, so de-duplicate and
          # sort with conda's own version ordering rather than trusting the
          # order packages come back in.
          AVAILABLE=$(
            conda search -c conda-forge --override-channels --json napari-phasors \
              | python -c "
          import json, sys
          from conda.models.version import VersionOrder
          records = json.load(sys.stdin)['napari-phasors']
          print(' '.join(sorted({r['version'] for r in records}, key=VersionOrder)))
          "
          )
          echo "Available on conda-forge: ${AVAILABLE}"
          if [ -n "${TAG}" ]; then
            VERSION="${TAG#v}"
            if ! printf '%s\n' ${AVAILABLE} | grep -qx "${VERSION}"; then
              echo "::error::napari-phasors ${VERSION} (tag ${TAG}) is not on conda-forge, so it cannot be bundled. Available: ${AVAILABLE}"
              exit 1
            fi
            echo "Building version ${VERSION} from tag ${TAG}"
          else
            VERSION="${AVAILABLE##* }"
            echo "No tag supplied - building latest conda-forge release ${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate construct.yaml and build
        shell: bash -el {0}
        run: |
          set -euo pipefail
          cd installer
          python make_construct.py --version "${{ steps.version.outputs.version }}"
          constructor .

      - name: List outputs
        shell: bash -el {0}
        run: ls -la installer/napari-phasors-*

      # Install the built .sh offline and check the resulting bundle the way a
      # user would meet it: the real launcher, under Xvfb, with the real xcb
      # platform plugin and no terminal attached. This catches both "installer
      # builds fine but the app never opens" and "app opens but cannot install
      # plugins", which are otherwise invisible until someone tests by hand.
      - name: Smoke test Linux installer
        if: matrix.platform == 'linux'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y xvfb >/dev/null
          SH_INSTALLER=( installer/napari-phasors-*.sh )
          if [[ ${#SH_INSTALLER[@]} -ne 1 ]]; then
            echo "ERROR: Expected exactly one .sh installer, found: ${SH_INSTALLER[*]}"
            exit 1
          fi
          INSTALL_DIR="${RUNNER_TEMP}/smoke-install"
          echo "=== Installing (network blocked) ==="
          env http_proxy="${OFFLINE_PROXY}" https_proxy="${OFFLINE_PROXY}" \
              HTTP_PROXY="${OFFLINE_PROXY}" HTTPS_PROXY="${OFFLINE_PROXY}" \
              bash "${SH_INSTALLER[0]}" -b -p "${INSTALL_DIR}"

          echo "=== Verifying bundle ==="
          # Source the same file the launcher does, so the checks see exactly
          # the environment napari runs in - including this runner's own conda
          # being shadowed by the bundled one.
          export NAPARI_PHASORS_ROOT="${INSTALL_DIR}"
          # shellcheck source=installer/launcher-env.sh
          . "${INSTALL_DIR}/launcher-env.sh"
          QT_QPA_PLATFORM=offscreen "${NAPARI_PHASORS_ENV}/bin/python" \
            installer/verify_installation.py

          echo "=== Launcher test (xcb under Xvfb) ==="
          STATUS=0
          xvfb-run -a "${INSTALL_DIR}/napari-phasors" --info || STATUS=$?
          echo "=== Launch log ==="
          cat "${INSTALL_DIR}/last-launch.log" 2>/dev/null || echo "(no log written)"
          if [ "${STATUS}" -ne 0 ]; then
            echo "ERROR: launcher exited with status ${STATUS}"
            exit "${STATUS}"
          fi

      - name: Build macOS .app bundle
        if: matrix.platform == 'macos'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SH_INSTALLER=( installer/napari-phasors-*.sh )
          if [[ ${#SH_INSTALLER[@]} -ne 1 ]]; then
            echo "ERROR: Expected exactly one .sh installer, found: ${SH_INSTALLER[*]}"
            exit 1
          fi
          INSTALL_DIR="${RUNNER_TEMP}/napari-phasors-install"
          APP_DIR="${RUNNER_TEMP}/dmg-contents/napari-phasors.app"

          echo "=== Running .sh installer silently (network blocked) ==="
          env http_proxy="${OFFLINE_PROXY}" https_proxy="${OFFLINE_PROXY}" \
              HTTP_PROXY="${OFFLINE_PROXY}" HTTPS_PROXY="${OFFLINE_PROXY}" \
              bash "${SH_INSTALLER[0]}" -b -p "${INSTALL_DIR}"

          echo "=== Creating .app bundle ==="
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          cat > "${APP_DIR}/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>CFBundleName</key>
              <string>napari-phasors</string>
              <key>CFBundleExecutable</key>
              <string>napari-phasors</string>
              <key>CFBundleIdentifier</key>
              <string>org.napari-phasors.app</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleIconFile</key>
              <string>app.icns</string>
            </dict>
          </plist>
          PLIST

          # Thin shim only. The real launcher ships inside the install root and
          # derives every path from its own location, so it keeps working after
          # the tree is moved here and again when the user drags the .app into
          # /Applications. Nothing invokes the console scripts whose shebangs
          # hold the build-time prefix: napari and conda are both started as
          # `python -m`, which resolves the interpreter by path.
          cat > "${APP_DIR}/Contents/MacOS/napari-phasors" << 'LAUNCHER'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "${SCRIPT_DIR}/../Resources/env/napari-phasors" "$@"
          LAUNCHER
          chmod +x "${APP_DIR}/Contents/MacOS/napari-phasors"

          echo "=== Moving install root into the .app bundle ==="
          mv "${INSTALL_DIR}" "${APP_DIR}/Contents/Resources/env"

          # If the installer shipped an app.icns at the install root, copy it
          # into the .app Resources so the app has an icon.
          if [ -f "${APP_DIR}/Contents/Resources/env/app.icns" ]; then
            cp "${APP_DIR}/Contents/Resources/env/app.icns" "${APP_DIR}/Contents/Resources/app.icns"
          fi
          ls -la "${APP_DIR}/Contents/Resources/env"

      - name: Smoke test macOS app bundle
        if: matrix.platform == 'macos'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          APP_DIR="${RUNNER_TEMP}/dmg-contents/napari-phasors.app"

          echo "=== Verifying bundle ==="
          export NAPARI_PHASORS_ROOT="${APP_DIR}/Contents/Resources/env"
          # shellcheck source=installer/launcher-env.sh
          . "${NAPARI_PHASORS_ROOT}/launcher-env.sh"
          QT_QPA_PLATFORM=offscreen "${NAPARI_PHASORS_ENV}/bin/python" \
            installer/verify_installation.py

          echo "=== Launcher test (through the .app shim) ==="
          STATUS=0
          QT_QPA_PLATFORM=offscreen \
            "${APP_DIR}/Contents/MacOS/napari-phasors" --info || STATUS=$?
          echo "=== Launch log ==="
          cat "${TMPDIR:-/tmp}/napari-phasors-launch.log" 2>/dev/null \
            || echo "(no log written)"
          if [ "${STATUS}" -ne 0 ]; then
            echo "ERROR: launcher exited with status ${STATUS}"
            exit "${STATUS}"
          fi

      - name: Create macOS DMG
        if: matrix.platform == 'macos'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DMG_CONTENTS="${RUNNER_TEMP}/dmg-contents"
          ln -s /Applications "${DMG_CONTENTS}/Applications"

          echo "=== Creating DMG ==="
          ARCH="$(uname -m)"
          hdiutil create \
            -volname "napari-phasors" \
            -srcfolder "${DMG_CONTENTS}" \
            -ov \
            -format UDZO \
            "installer/napari-phasors-${VERSION}-macOS-${ARCH}.dmg"

          rm -f installer/napari-phasors-*.sh
          echo "=== DMG created ==="
          ls -la installer/napari-phasors-*

      - name: Smoke test Windows installer
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          set "EXE="
          for %%f in (installer\napari-phasors-*.exe) do set "EXE=%%f"
          if not defined EXE (
            echo ERROR: no .exe installer found
            exit /b 1
          )
          set "INSTALL_DIR=%RUNNER_TEMP%\smoke-install"
          set "APP_ENV=%INSTALL_DIR%\envs\napari-phasors"

          echo === Installing (network blocked) ===
          set "HTTP_PROXY=%OFFLINE_PROXY%"
          set "HTTPS_PROXY=%OFFLINE_PROXY%"
          start /wait "" "%EXE%" /S /InstallationType=JustMe /AddToPath=0 /RegisterPython=0 /D=%INSTALL_DIR%
          set "RC=%ERRORLEVEL%"
          set "HTTP_PROXY="
          set "HTTPS_PROXY="
          if not "%RC%"=="0" (
            echo ERROR: installer exited with status %RC%
            exit /b %RC%
          )
          if not exist "%APP_ENV%\python.exe" (
            echo ERROR: app environment missing at %APP_ENV%
            dir "%INSTALL_DIR%"
            exit /b 1
          )

          echo === Verifying bundle ===
          call "%INSTALL_DIR%\launcher-env.bat"
          set "QT_QPA_PLATFORM=offscreen"
          "%APP_ENV%\python.exe" installer\verify_installation.py
          if errorlevel 1 exit /b 1

          REM Exercise the same entry point the shortcut launches. napari is a
          REM noarch package, so Scripts\napari.exe is generated at install
          REM time rather than shipped; this catches it not being generated.
          echo === napari --info ===
          "%APP_ENV%\Scripts\napari.exe" --info
          if errorlevel 1 exit /b 1

      - name: Upload installer as artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: installer-${{ matrix.platform }}
          path: installer/napari-phasors-*
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@4fabdc8bec0ad32a2eb09fb8fd1d04fd30a75562 # v2.0.5
        with:
          tag_name: ${{ inputs.tag }}
          files: installer/napari-phasors-*
