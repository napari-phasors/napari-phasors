# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py{312, 313, 314}-{linux,macos,windows}-{pyqt6,pyside6}
isolated_build=true

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows
BACKEND =
    pyqt6: pyqt6
    pyside6: pyside6

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
extras =
    testing
setenv =
    pyqt6: QT_API = pyqt6
    pyside6: QT_API = pyside6
    # Dump a C-level traceback if a worker segfaults (e.g. PySide6 teardown).
    PYTHONFAULTHANDLER = 1
    # Measure coverage through sys.monitoring (PEP 669) instead of the C
    # tracer: ~17% less test time locally, and coverage.py already defaults
    # to it on Python 3.14, whose CI jobs ran faster than 3.12/3.13 (about
    # half the time on Windows). It lacks branch coverage before 3.14, but we
    # only measure lines.
    COVERAGE_CORE = sysmon
deps =
    pyqt6: pyqt6
    pyside6: pyside6
commands = pytest -v --color=yes --cov=napari_phasors --cov-report=xml
